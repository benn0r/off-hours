name: OffHours
options:
  bundleIdPrefix: ch.benn0r
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6Y9Y97KCW2
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OffHours:
    type: application
    platform: iOS
    sources:
      - OffHours
      - Shared
    info:
      path: OffHours/Info.plist
      properties:
        CFBundleDisplayName: OffHours
        NSCalendarsFullAccessUsageDescription: OffHours reads your holiday and work calendars to know your days off and on-call shifts.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: OffHours/OffHours.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.ch.benn0r.off-hours]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benn0r.off-hours
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: OffHoursMonitor
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
  OffHoursMonitor:
    type: app-extension
    platform: iOS
    sources:
      - OffHoursMonitor
      - Shared
    info:
      path: OffHoursMonitor/Info.plist
      properties:
        CFBundleDisplayName: OffHours Monitor
        NSCalendarsFullAccessUsageDescription: OffHours reads your holiday and work calendars to know your days off and on-call shifts.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    entitlements:
      path: OffHoursMonitor/OffHoursMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.ch.benn0r.off-hours]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benn0r.off-hours.monitor
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
  OffHoursTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OffHoursTests
      - Shared/Model
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.benn0r.off-hours.tests
schemes:
  OffHours:
    build:
      targets:
        OffHours: all
    test:
      targets:
        - OffHoursTests
